name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@fbe4d05b41aaff86a7a38bd0228943d8cfead4e1
    with:
      breaking-change-bump: minor
      crate-name: http-streaming-envelope
      kind: library
    secrets: inherit
