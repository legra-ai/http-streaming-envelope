name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@b3cebd0e56098fb20bbf8bc2d5770b82d9020ddd
    with:
      breaking-change-bump: minor
      crate-name: http-streaming-envelope
      kind: library
    secrets: inherit
