name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@830df535a95588c9e8807aad6952bf887d55dc4d
    with:
      breaking-change-bump: minor
      crate-name: http-streaming-envelope
      kind: library
    secrets: inherit
