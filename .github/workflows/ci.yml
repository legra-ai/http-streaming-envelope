name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@03689aa49b2c6f7ab5872a37c2613c50482c8649
    with:
      breaking-change-bump: minor
      crate-name: http-streaming-envelope
      kind: library
    secrets: inherit
