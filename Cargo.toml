[package]
name = "http-streaming-envelope"
version = "0.1.1"
description = "HTTP-native streaming response metadata with bounded completion trailers"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/legra-ai/http-streaming-envelope"
keywords = ["http", "streaming", "tower", "axum", "backpressure"]
categories = ["web-programming::http-server", "web-programming::http-client"]
publish = true
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
]

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
httpdate = "1"
pin-project-lite = "0.2"
thiserror = "2"
tower = "0.5"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
