name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@49efdb43fdabe6f5be5ac9bac23e126e4f5aca97
    with:
      breaking-change-bump: minor
      crate-name: http-streaming-envelope
      kind: library
    secrets: inherit
